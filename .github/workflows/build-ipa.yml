name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Generate app icon
        run: python3 Tools/make_icon.py SurgeLite/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        id: build
        continue-on-error: true
        run: |
          set +e
          xcodebuild \
            -project SurgeLite.xcodeproj \
            -scheme SurgeLite \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          echo "EXIT_CODE=$?" >> build.log
          tail -n 80 build.log

      - name: Publish build report
        if: always()
        run: |
          {
            echo "# Build report"
            echo ""
            echo "时间：$(date -u)"
            echo ""
            echo '```'
            grep -nE "error:|warning:|BUILD FAILED|BUILD SUCCEEDED|The following build commands failed|EXIT_CODE" build.log | head -120 || true
            echo '```'
            echo ""
            echo "## 日志尾部"
            echo '```'
            tail -n 40 build.log || true
            echo '```'
          } > build-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report.md
          git commit -m "ci: build report [skip ci]" || true
          git push || true

      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/SurgeLite.app"
          ls -la "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr SurgeLite-unsigned.ipa Payload
          ls -lh SurgeLite-unsigned.ipa

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SurgeLite-unsigned-ipa
          path: SurgeLite-unsigned.ipa

      - name: Publish release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SurgeLite build ${{ github.run_number }}
          body: |
            未签名 IPA，构建自 ${{ github.sha }}
            安装前需要用全能签 / Sideloadly / ESign / AltStore 自行签名。
          files: SurgeLite-unsigned.ipa
          draft: false
          prerelease: false
